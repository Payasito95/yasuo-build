name: Compilar APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon
      - name: Publicar en Releases (siempre en el mismo link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk yasuo-build.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk yasuo-build.apk --title "Yasuo Build (app de Android)" --notes "Versión ${{ github.run_number }}. Instalá yasuo-build.apk en el Red Magic."
